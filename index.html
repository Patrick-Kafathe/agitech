<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4a2a">
<meta name="description" content="Agitech Seedlings: healthy seedlings for a bumper harvest. Vegetables, fruits, herbs and trees from Mutithi, Kirinyaga County, delivered across Kenya.">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Agitech Seedlings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: sticky white header, split hero slider, product grids with auto-sliding photos, slide-in cart, full admin panel behind #admin.
   Colour comes from the logo: leaf green, deep forest, charcoal type, on white. Single light theme by design. */
:root{
  --bg:#ffffff; --soft:#f4f8f2; --soft2:#e9f1e5; --ink:#262b26; --muted:#667066; --line:#dfe7db;
  --green:#3f8a3b; --green-d:#2a6a2e; --forest:#1d4a2a; --lime:#8cc63f; --soil:#7a5a3a; --warn:#c2410c; --warnbg:#fff3ea;
  --font-d:'Outfit','Segoe UI',system-ui,sans-serif; --font-b:'Inter','Segoe UI',system-ui,sans-serif;
  --r:14px; --shadow:0 10px 30px -14px rgba(29,74,42,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--font-b);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:60}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--font-d);line-height:1.15;margin:0;text-wrap:balance;color:var(--forest)}
h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
a{color:var(--green-d)}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:6px}
.ic{width:1.2em;height:1.2em;vertical-align:-.2em;flex:none}
.eyebrow{font:600 .78rem/1 var(--font-b);letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;border-radius:999px;padding:.8rem 1.4rem;font-weight:600;text-decoration:none;background:var(--green);color:#fff;transition:background .2s,transform .2s;white-space:nowrap}
.btn:hover{background:var(--green-d);transform:translateY(-1px)}
.btn.alt{background:#fff;color:var(--forest);box-shadow:inset 0 0 0 2px var(--line)}
.btn.alt:hover{box-shadow:inset 0 0 0 2px var(--green)}
.btn.dark{background:var(--forest)}
.btn.sm{padding:.5rem 1rem;font-size:.9rem}
.btn.wa{background:#1f9d55}
.btn.danger{background:var(--warn)}
.btn[disabled]{opacity:.5;pointer-events:none}

/* splash */
#splash{position:fixed;inset:0;z-index:200;background:#fff;display:grid;place-items:center;text-align:center;animation:splashOut .7s ease 2.7s forwards}
#splash .in{display:grid;gap:18px;justify-items:center;padding:24px}
#splash img{width:min(300px,70vw);opacity:0;animation:rise .9s ease .9s forwards}
#splash .bar{width:min(220px,60vw);height:4px;border-radius:4px;background:var(--soft2);overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--lime));animation:load 2.2s ease .3s forwards}
#splash p{font:600 .78rem var(--font-b);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);opacity:0;animation:rise .8s ease 1.4s forwards}
.sprout{width:110px;height:110px}
.sprout .stem{stroke-dasharray:70;stroke-dashoffset:70;animation:draw .9s ease .2s forwards}
.sprout .lf{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);animation:pop .6s cubic-bezier(.3,1.6,.5,1) forwards}
.sprout .l1{animation-delay:.8s}.sprout .l2{animation-delay:1s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar{background:var(--forest);color:#e6f2e0;font-size:.85rem}
.topbar .wrap{display:flex;gap:1.2rem;justify-content:space-between;align-items:center;padding-top:.45rem;padding-bottom:.45rem;flex-wrap:wrap}
.topbar a{color:#fff;text-decoration:none}
.topbar .l,.topbar .r{display:flex;gap:1.1rem;flex-wrap:wrap;align-items:center}
.nav{display:flex;align-items:center;gap:1rem;padding-top:.6rem;padding-bottom:.6rem}
.brand img{height:50px;width:auto}
.nav nav{display:flex;gap:.2rem;margin-left:auto;align-items:center}
.nav nav a{padding:.5rem .8rem;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:500}
.nav nav a:hover,.nav nav a.on{background:var(--soft2);color:var(--forest)}
.iconbtn{position:relative;border:0;background:var(--soft);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--forest)}
.iconbtn:hover{background:var(--soft2)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--green);color:#fff;font:700 .72rem/20px var(--font-b);text-align:center;padding:0 5px}
#menuBtn{display:none}
@media(max-width:700px){.topbar .r,.topbar .l span:nth-child(2){display:none}}
@media(max-width:900px){
  #menuBtn{display:grid;margin-left:auto}
  .nav nav{display:none;position:absolute;left:0;right:0;top:100%;background:#fff;flex-direction:column;align-items:stretch;padding:.6rem max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);box-shadow:var(--shadow);margin:0}
  .nav nav.open{display:flex}
  .nav nav a{padding:.8rem 1rem}
  .brand img{height:42px}
}

/* hero: full-bleed picture, left side faded to white, copy on top */
.hero{position:relative;height:clamp(560px,84vh,740px);overflow:hidden;background:#eef5ea}
.hs{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 1.2s}
.hs.on{opacity:1;visibility:visible;z-index:2}
.hs .bg{position:absolute;inset:0;overflow:hidden}
.hs .bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.14);transition:transform 9s ease-out}
.hs.on .bg img{transform:scale(1)}
.hs[data-fx="1"] .bg img{transform:scale(1.1) translateX(4%)}
.hs[data-fx="1"].on .bg img{transform:scale(1.04) translateX(0)}
.hs[data-fx="2"] .bg img{transform:scale(1)}
.hs[data-fx="2"].on .bg img{transform:scale(1.12)}
.hs .fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.93) 28%,rgba(255,255,255,.62) 50%,rgba(255,255,255,.12) 72%,rgba(255,255,255,0) 100%)}
.hs .content{position:relative;z-index:2;height:100%;display:flex;align-items:center}
.hs .txt{max-width:620px;display:grid;gap:1.15rem;justify-items:start;padding-bottom:2.2rem}
.hs .txt>*{opacity:0;transform:translateY(30px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.hs[data-fx="1"] .txt>*{transform:translateX(-50px)}
.hs[data-fx="2"] .txt>*{transform:scale(.9)}
.hs.on .txt>*{opacity:1;transform:none}
.hs.on .txt>*:nth-child(1){transition-delay:.35s}.hs.on .txt>*:nth-child(2){transition-delay:.5s}.hs.on .txt>*:nth-child(3){transition-delay:.65s}.hs.on .txt>*:nth-child(4){transition-delay:.8s}
.hs h1{font-size:clamp(2.1rem,5.4vw,4rem);letter-spacing:-.01em}
.hs .lead{font-size:clamp(1.02rem,1.6vw,1.2rem);color:#3d4a3e;max-width:34rem}
.hs .eyebrow{background:rgba(255,255,255,.85);padding:.45rem .8rem;border-radius:999px;border:1px solid var(--line)}
.hprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.5);z-index:6}
.hprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--lime))}
.hero.run .hprog i{animation:hp 6s linear forwards}
@keyframes hp{to{width:100%}}
.hctl{position:absolute;z-index:6;left:0;right:0;bottom:22px}
.hctl .wrap{display:flex;align-items:center;gap:1rem}
.hdots{display:flex;gap:8px;align-items:center}
.hdots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(29,74,42,.28);padding:0;transition:all .3s}
.hdots button.on{background:var(--green);width:34px;border-radius:6px}
.hcount{font:700 .95rem var(--font-d);color:var(--forest);letter-spacing:.08em}
.harrow{width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);color:var(--forest);display:grid;place-items:center;transition:transform .2s,background .2s}
.harrow:hover{background:var(--green);color:#fff;transform:scale(1.08)}
.hctl .sp{flex:1}
.hfloat{position:absolute;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:84px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:.9rem 1.1rem;display:flex;gap:.8rem;align-items:center;box-shadow:var(--shadow);max-width:340px;text-align:left;color:var(--ink);transition:transform .25s}
.hfloat:hover{transform:translateY(-4px)}
.hfloat b{display:block;font-family:var(--font-d);color:var(--forest);line-height:1.25}
.hfloat small{color:var(--muted)}
.hfloat .ic{width:2rem;height:2rem;color:var(--green)}
@media(max-width:820px){
  .hero{height:auto;min-height:0}
  .hs .fade{background:linear-gradient(180deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.86) 55%,rgba(255,255,255,.4) 100%)}
  .hs .content{align-items:flex-start;padding-top:2.4rem}
  .hfloat{display:none}
  .hctl .harrow{display:none}
}

/* sections */
section.s{padding:4.2rem 0}
section.soft{background:var(--soft)}
.sh{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
.sh .t{display:grid;gap:.6rem}
.sh p{color:var(--muted);max-width:40rem}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:-1.8rem;position:relative;z-index:6}
.trust div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;display:flex;gap:.9rem;align-items:center;box-shadow:var(--shadow)}
.trust .ic{width:2rem;height:2rem;color:var(--green)}
.trust b{display:block;font-family:var(--font-d);color:var(--forest)}
.trust span{font-size:.88rem;color:var(--muted);line-height:1.3;display:block}
@media(max-width:900px){.trust{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.trust{grid-template-columns:1fr}}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.cat{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3.4;text-decoration:none;color:#fff;display:flex;align-items:end;border:0;cursor:pointer}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.cat:hover img{transform:scale(1.06)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,50,28,.86),rgba(20,50,28,0) 62%)}
.cat div{position:relative;z-index:1;padding:1rem 1.1rem;display:grid;gap:.15rem}
.cat b{font:700 1.3rem var(--font-d)}.cat span{font-size:.86rem;opacity:.92}
@media(max-width:900px){.cats{grid-template-columns:1fr 1fr}}

/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.3rem}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .25s,transform .25s;min-width:0}
.card:hover{box-shadow:var(--shadow);transform:translateY(-3px)}
.pm{position:relative;aspect-ratio:4/3;background:var(--soft2);overflow:hidden}
.pm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease}
.pm img.on{opacity:1}
.tag{position:absolute;left:10px;top:10px;z-index:2;background:#fff;color:var(--forest);font:600 .72rem var(--font-b);letter-spacing:.06em;text-transform:uppercase;padding:.3rem .65rem;border-radius:999px}
.tag.out{background:var(--warn);color:#fff}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:6px;justify-content:center;z-index:2}
.dots button{width:7px;height:7px;background:rgba(255,255,255,.7)}
.dots button.on{background:#fff;width:18px}
.card .b{padding:1rem 1.1rem 1.2rem;display:grid;gap:.5rem;flex:1;align-content:start}
.card .b a{text-decoration:none;color:inherit}
.card h3 a:hover{color:var(--green)}
.cat-l{font:600 .72rem var(--font-b);letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.price{font:700 1.25rem var(--font-d);color:var(--forest)}
.price small{font:400 .8rem var(--font-b);color:var(--muted)}
.row{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.45rem 1rem;font-weight:500;color:var(--ink)}
.chip.on,.chip:hover{background:var(--forest);color:#fff;border-color:var(--forest)}
.tools{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1.5rem;align-items:center;justify-content:space-between}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #c9d5c4;border-radius:10px;padding:.65rem .8rem;width:100%;min-width:0}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--lime);border-color:var(--green)}
.search{position:relative;flex:1;min-width:220px;max-width:420px}
.search input{padding-left:2.4rem}
.search .ic{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.sel{width:auto}

/* product page */
.crumbs{font-size:.88rem;color:var(--muted);padding:1.2rem 0}
.crumbs a{color:var(--muted)}
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:2.4rem;align-items:start}
.gal .pm{aspect-ratio:1/.82;border-radius:20px;border:1px solid var(--line)}
.thumbs{display:flex;gap:.6rem;margin-top:.7rem;flex-wrap:wrap}
.thumbs button{width:76px;height:60px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--soft2)}
.thumbs button.on{border-color:var(--green)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.pd .info{display:grid;gap:1rem}
.pd .price{font-size:2rem}
.qty{display:inline-flex;align-items:center;border:1px solid #c9d5c4;border-radius:999px;overflow:hidden}
.qty button{border:0;background:var(--soft);width:40px;height:40px;display:grid;place-items:center;color:var(--forest)}
.qty input{width:70px;border:0;text-align:center;border-radius:0;padding:.4rem}
.facts{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1.4rem;font-size:.95rem;border-top:1px solid var(--line);padding-top:1rem}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:500}
@media(max-width:820px){.pd{grid-template-columns:1fr}}

/* drawer + cart */
.ov{position:fixed;inset:0;background:rgba(20,40,25,.45);z-index:90;opacity:0;visibility:hidden;transition:.25s}
.ov.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:#fff;z-index:100;transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
.drawer .items{flex:1;overflow:auto;padding:.6rem 1.2rem;display:grid;gap:.9rem;align-content:start}
.drawer footer{padding:1rem 1.2rem;border-top:1px solid var(--line);display:grid;gap:.7rem}
.li{display:grid;grid-template-columns:70px 1fr auto;gap:.8rem;align-items:center;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.li img{width:70px;height:56px;object-fit:cover;border-radius:8px;background:var(--soft2)}
.li b{font-family:var(--font-d);display:block;line-height:1.2}
.li small{color:var(--muted)}
.li .qty button{width:30px;height:30px}.li .qty input{width:52px;padding:.2rem}
.empty{text-align:center;color:var(--muted);padding:3rem 1rem;display:grid;gap:1rem;justify-items:center}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:2rem;align-items:start}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.4rem}
.form{display:grid;gap:.9rem}
.form .f2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
@media(max-width:560px){.form .f2{grid-template-columns:1fr}}
label.l{display:grid;gap:.3rem;font-weight:500;font-size:.92rem}
label.l small{font-weight:400;color:var(--muted)}
.sum div{display:flex;justify-content:space-between;padding:.3rem 0}
.sum .tot{border-top:2px solid var(--forest);margin-top:.4rem;padding-top:.7rem;font:700 1.2rem var(--font-d);color:var(--forest)}
.note{background:var(--soft);border-radius:10px;padding:.8rem 1rem;font-size:.9rem;color:var(--muted)}
.note.warn{background:var(--warnbg);color:var(--warn)}

/* about / events */
.split{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center}
@media(max-width:860px){.split{grid-template-columns:1fr;gap:1.6rem}}
.round{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/3.2}
.round img{width:100%;height:100%;object-fit:cover}
.split>*,.two>*,.stats>*{min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.4rem}
@media(max-width:520px){.stats b{font-size:1.4rem}.stats{gap:.6rem}}
.stats div{border-left:4px solid var(--lime);padding-left:.9rem}
.stats b{font:800 1.9rem var(--font-d);color:var(--forest);display:block}
.stats span{font-size:.88rem;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;counter-reset:s}
.steps div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.3rem;display:grid;gap:.5rem;counter-increment:s}
.steps div::before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font:700 1rem var(--font-d)}
.steps p{color:var(--muted);font-size:.95rem}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}
.ev{display:grid;grid-template-columns:200px 1fr;gap:1.2rem;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ev .img{position:relative;min-height:170px}
.ev .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ev .bd{padding:1.1rem 1.2rem 1.2rem 0;display:grid;gap:.5rem;align-content:center}
.ev .meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.ev .meta span{display:inline-flex;gap:.35rem;align-items:center}
.ev .date{position:absolute;left:10px;top:10px;background:#fff;border-radius:10px;padding:.35rem .6rem;text-align:center;font:700 .75rem/1.1 var(--font-d);color:var(--forest);z-index:2;text-transform:uppercase}
.ev .date b{display:block;font-size:1.3rem;color:var(--green)}
.evlist{display:grid;gap:1.1rem}
@media(max-width:620px){.ev{grid-template-columns:1fr}.ev .bd{padding:0 1.1rem 1.2rem}.ev .img{min-height:190px}}
.bars{display:grid;gap:.7rem}
.bars div{display:grid;grid-template-columns:90px 1fr 90px;gap:.8rem;align-items:center;font-size:.92rem}
.bars i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--green),var(--lime))}
.bars span:last-child{font-weight:600;text-align:right}
.badge2{display:inline-block;font:600 .72rem var(--font-b);padding:.2rem .6rem;border-radius:999px;background:var(--soft2);color:var(--forest);letter-spacing:.05em;text-transform:uppercase}
.badge2.up{background:var(--lime);color:#1c3a10}

/* newsletter + footer */
.news{background:linear-gradient(120deg,var(--forest),var(--green-d));color:#fff;border-radius:28px;padding:2.6rem;display:grid;grid-template-columns:1.1fr 1fr;gap:2rem;align-items:center}
.news h2{color:#fff}.news p{color:#d8ecd2}
.news form{display:flex;gap:.6rem}
.news input{border:0}

/* admin */

.adm aside h4{color:#fff;padding:.4rem .6rem .8rem;font-size:1rem}
.adm aside button{background:none;border:0;color:#cfe3c9;text-align:left;padding:.65rem .8rem;border-radius:10px;display:flex;gap:.6rem;align-items:center}

.adm main{min-width:0;display:grid;gap:1.2rem}
.adm .tit{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}

.kpis div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.2rem}
.kpis b{font:800 1.8rem var(--font-d);color:var(--forest);display:block}
.kpis span{color:var(--muted);font-size:.88rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}

tr:last-child td{border-bottom:0}
td img{width:56px;height:44px;object-fit:cover;border-radius:6px;background:var(--soft2)}
.acts{display:flex;gap:.4rem;flex-wrap:nowrap}
.sm-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.35rem .65rem;font-size:.85rem;color:var(--ink);display:inline-flex;gap:.3rem;align-items:center}

.sm-btn.red{color:var(--warn)}.sm-btn.red.arm{background:var(--warn);color:#fff;border-color:var(--warn)}
.modal{position:fixed;inset:0;z-index:150;background:rgba(20,40,25,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal .box{background:#fff;border-radius:20px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:1.5rem;display:grid;gap:1rem;margin:auto}
.modal .box header{display:flex;justify-content:space-between;align-items:center}
.imgs{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.imgs .th{position:relative;width:96px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.imgs .th img{width:100%;height:100%;object-fit:cover}
.imgs .th button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:.8rem;line-height:1}
.upl{display:inline-flex;gap:.4rem;align-items:center;border:2px dashed #b6c9b0;border-radius:10px;padding:.6rem 1rem;color:var(--green-d);cursor:pointer;font-weight:500;background:var(--soft)}
.upl input{display:none}
.login{max-width:420px;margin:4rem auto}
.ck{display:flex;gap:.6rem;align-items:center}.ck input{width:auto}

.pill.New{background:#fff3cf;color:#8a5a00}.pill.Delivered{background:#d9f2d3;color:#1d5a1d}.pill.Cancelled{background:#fde0d6;color:#9a3412}.pill.Confirmed{background:#dbeafe;color:#1e40af}
@media(max-width:860px){.adm{grid-template-columns:1fr}.adm aside{position:static;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.adm aside h4{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}html{scroll-behavior:auto}}

/* ---- v2 additions ---- */
#root{overflow-x:clip}
.si{display:block;flex:none}
.lnk{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font:inherit}
.topbar .lnk{color:#fff;text-decoration:none}
.topbar .lnk:hover{text-decoration:underline}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--green),var(--lime));z-index:400}
.ann{background:var(--lime);color:#1c3a10;font-size:.9rem;font-weight:500;position:relative;z-index:55}
.ann .wrap{display:flex;gap:.8rem;align-items:center;justify-content:center;padding-top:.5rem;padding-bottom:.5rem;flex-wrap:wrap;text-align:center}
.ann a,.ann .lnk{color:#1c3a10;font-weight:700}
.ann .x{border:0;background:none;color:#1c3a10;padding:.2rem}
#totop{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:46px;height:46px;border-radius:50%;border:0;background:var(--forest);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(10px);transition:.3s}
#totop.on{opacity:1;visibility:visible;transform:none}

/* reveal */
.rv{opacity:.25;transform:translateY(36px) scale(.97);transition:opacity .75s ease var(--d,0s),transform .75s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.rv.l{transform:translateX(-46px)}.rv.r{transform:translateX(46px)}.rv.z{transform:scale(.86)}
.rv.in{opacity:1;transform:none}

/* speed dial */
.sd{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:45;display:grid;gap:.6rem;justify-items:end}
.sd .main{width:58px;height:58px;border-radius:50%;border:0;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .3s,background .2s}
.sd .main:hover{background:var(--green-d)}
.sd.open .main{transform:rotate(90deg);background:var(--forest)}
.sd .it{display:flex;gap:.6rem;align-items:center;opacity:0;visibility:hidden;transform:translateY(14px) scale(.9);transition:.25s;border:0;background:none;padding:0;text-decoration:none;color:var(--ink)}
.sd.open .it{opacity:1;visibility:visible;transform:none}
.sd .it span{background:#fff;border-radius:999px;padding:.35rem .85rem;font-weight:600;font-size:.88rem;box-shadow:var(--shadow);color:var(--forest)}
.sd .it .si{filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
.sd .it .ci{width:44px;height:44px;border-radius:50%;background:var(--forest);display:grid;place-items:center;color:#fff}

/* pop-ups */
.pop{position:fixed;inset:0;z-index:250;background:rgba(15,35,20,.62);display:grid;place-items:center;padding:16px;overflow:auto;animation:fadeIn .25s ease;backdrop-filter:blur(3px)}
.pop .sheet{background:#fff;border-radius:26px;width:min(1040px,100%);max-height:94vh;overflow:auto;position:relative;animation:popIn .4s cubic-bezier(.2,.9,.3,1.15);margin:auto}
.pop .sheet.sm{width:min(560px,100%)}
.pop .sheet.md{width:min(760px,100%)}
.pop .x{position:absolute;right:14px;top:14px;z-index:8;background:#fff;box-shadow:var(--shadow)}
.pbody{padding:2rem;display:grid;gap:1rem}
.pbody .big{width:64px;height:64px;border-radius:20px;background:var(--soft2);color:var(--green-d);display:grid;place-items:center}
.pbody .big .ic{width:32px;height:32px}
.pbody ul{margin:0;padding:0;list-style:none;display:grid;gap:.5rem}
.pbody li{display:flex;gap:.6rem;align-items:flex-start}
.pbody li .ic{color:var(--green);margin-top:.25rem}
.pbody p{color:#47524a}
.cpy{display:flex;gap:.6rem;align-items:center;justify-content:space-between;background:var(--soft);border-radius:14px;padding:.8rem 1rem;flex-wrap:wrap}
.cpy b{font:700 1.2rem var(--font-d);color:var(--forest)}
@keyframes fadeIn{from{opacity:0}}
@keyframes popIn{from{opacity:0;transform:translateY(30px) scale(.92)}}
.evpop .pic{aspect-ratio:16/7;position:relative;overflow:hidden}
.evpop .pic img{width:100%;height:100%;object-fit:cover}

/* search pop */
.sres{display:grid;gap:.4rem;max-height:52vh;overflow:auto}
.sres button{display:grid;grid-template-columns:54px 1fr auto;gap:.8rem;align-items:center;text-align:left;border:0;background:#fff;border-radius:12px;padding:.5rem;color:var(--ink)}
.sres button:hover{background:var(--soft)}
.sres img{width:54px;height:44px;border-radius:8px;object-fit:cover}
.sres small{color:var(--muted)}

/* lightbox */
#lb:empty{display:none}
.lb{position:fixed;inset:0;z-index:350;background:rgba(8,18,10,.92);display:grid;place-items:center;padding:24px;animation:fadeIn .25s}
.lb figure{margin:0;max-width:min(1100px,100%);display:grid;gap:.8rem;justify-items:center}
.lb img{max-height:78vh;max-width:100%;border-radius:14px;object-fit:contain;background:#fff}
.lb figcaption{color:#e6f2e0;text-align:center}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%)}
.lb .nv.p{left:16px}.lb .nv.n{right:16px}
.lb .cl{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px))}

/* product body (page + quick view) */
.pdx{display:grid;grid-template-columns:1.15fr 1fr;gap:0;align-items:stretch}
.pdx .gal{padding:1.4rem;background:var(--soft);display:grid;gap:.8rem;align-content:start}
.page .pdx{border:1px solid var(--line);border-radius:26px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.pdx .pmw{position:relative}
.pdx .pm{aspect-ratio:1/.92;border-radius:20px;cursor:zoom-in}
.zoom{position:absolute;right:12px;bottom:12px;z-index:4;background:#fff;border:0;border-radius:999px;padding:.45rem .9rem;font-weight:600;font-size:.85rem;display:flex;gap:.4rem;align-items:center;color:var(--forest);box-shadow:var(--shadow)}
.pdx .thumbs{margin:0}
.pdx .thumbs button{width:84px;height:66px}
.pdx .inf{padding:2rem 2rem 1.6rem;display:grid;gap:1.1rem;align-content:start}
.pdx .inf h1,.pdx .inf h2.pt{font-size:clamp(1.6rem,3vw,2.3rem)}
.pdx .price{font-size:2.2rem}
.pdx .meta{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sp1{font:600 .78rem var(--font-b);padding:.3rem .75rem;border-radius:999px;background:var(--soft2);color:var(--forest)}
.sp1.ok{background:#d9f2d3;color:#1d5a1d}.sp1.no{background:#fde0d6;color:#9a3412}
.ftiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem}
.ftiles button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:.7rem .4rem;display:grid;gap:.35rem;justify-items:center;font:600 .74rem/1.2 var(--font-b);color:var(--forest);text-align:center;transition:.2s}
.ftiles button:hover{background:var(--soft2);border-color:var(--green);transform:translateY(-2px)}
.ftiles .ic{width:26px;height:26px;color:var(--green)}
.presets{display:flex;gap:.4rem;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;color:var(--ink)}
.presets button:hover{background:var(--forest);color:#fff}
.est{font-size:.95rem;color:var(--muted)}.est b{color:var(--forest);font-family:var(--font-d);font-size:1.15rem}
.acc{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:1rem;border:0;background:#fff;padding:.85rem 1rem;font:600 .98rem var(--font-d);color:var(--forest);text-align:left}
.acc>button .ic{transition:transform .3s}
.acc .pn{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.acc .pn>div{overflow:hidden;padding:0 1rem;color:#47524a;font-size:.95rem}
.acc.open .pn{grid-template-rows:1fr}.acc.open .pn>div{padding-bottom:1rem}
.acc.open>button .ic{transform:rotate(180deg)}
.acc ul{margin:0;padding:0;list-style:none;display:grid;gap:.4rem}.acc li{display:flex;gap:.5rem}.acc li .ic{color:var(--green);margin-top:.28rem}
.acts2{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--forest);display:grid;place-items:center}
.circ:hover{background:var(--soft2)}
.circ.on{color:#d6336c;border-color:#f3b8cf}.circ.on svg{fill:#d6336c}
@media(max-width:860px){.pdx{grid-template-columns:1fr}.pdx .inf{padding:1.3rem}.ftiles{grid-template-columns:repeat(2,1fr)}}

/* cards v2 */
.heart{position:absolute;right:10px;top:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--forest);transition:transform .2s}
.heart:hover{transform:scale(1.12)}
.heart.on{color:#d6336c}.heart.on svg{fill:#d6336c}
.card .pm{cursor:zoom-in}
.qvh{position:absolute;left:50%;bottom:12px;transform:translate(-50%,16px);z-index:3;background:rgba(29,74,42,.92);color:#fff;font:600 .8rem var(--font-b);padding:.4rem .9rem;border-radius:999px;opacity:0;transition:.25s;display:flex;gap:.4rem;align-items:center;white-space:nowrap}
.card:hover .qvh{opacity:1;transform:translate(-50%,0)}
.card h3 button{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left}
.card h3 button:hover{color:var(--green)}
.grid.s{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.9rem}
.grid.s .card .b{padding:.7rem .8rem .9rem}.grid.s h3{font-size:.98rem}.grid.s .price{font-size:1.05rem}.grid.s .btn.sm{padding:.4rem .7rem}.grid.s .qvh{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;padding:.5rem .9rem;color:var(--ink);font-weight:500}
.seg button.on{background:var(--forest);color:#fff}

/* marquee */
.mq{background:var(--forest);color:#fff;overflow:hidden;padding:.9rem 0;margin-top:3rem}
.mq .tr{display:flex;gap:2.4rem;width:max-content;animation:mq 42s linear infinite}
.mq:hover .tr{animation-play-state:paused}
.mq a{color:#dff0d8;text-decoration:none;font:600 1.05rem var(--font-d);display:inline-flex;gap:.6rem;align-items:center;white-space:nowrap}
.mq a::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime)}
@keyframes mq{to{transform:translateX(-50%)}}

/* countdown */
.cdband{background:linear-gradient(120deg,var(--forest),#2b6b35);border-radius:28px;color:#fff;padding:2.2rem;display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;align-items:center;position:relative;overflow:hidden}
.cdband::before{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(140,198,63,.18)}
.cdband h2{color:#fff}.cdband p{color:#cfe6c8}
.cdgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;position:relative}
.cdgrid div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:.9rem .4rem;text-align:center}
.cdgrid b{display:block;font:800 clamp(1.5rem,3.4vw,2.3rem) var(--font-d);font-variant-numeric:tabular-nums}
.cdgrid span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#bfe0b5}
@media(max-width:860px){.cdband{grid-template-columns:1fr;padding:1.5rem}}

/* bento */
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.bt{border:0;text-align:left;border-radius:22px;padding:1.5rem;display:grid;gap:.7rem;align-content:start;background:#fff;border:1px solid var(--line);transition:transform .3s,box-shadow .3s,background .3s;color:var(--ink);min-height:190px;position:relative;overflow:hidden}
.bt:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.bt .ico{width:54px;height:54px;border-radius:16px;background:var(--soft2);display:grid;place-items:center;color:var(--green-d);transition:.3s}
.bt .ico .ic{width:28px;height:28px}
.bt:hover .ico{background:var(--green);color:#fff;transform:rotate(-6deg) scale(1.06)}
.bt p{color:var(--muted);font-size:.95rem}
.bt .more{font-weight:600;color:var(--green-d);font-size:.9rem;display:inline-flex;gap:.3rem;align-items:center}
.bt.dk{background:var(--forest);color:#fff;border-color:var(--forest)}.bt.dk h3{color:#fff}.bt.dk p{color:#cfe6c8}.bt.dk .ico{background:rgba(255,255,255,.12);color:var(--lime)}.bt.dk .more{color:var(--lime)}
.bt.lm{background:var(--soft2)}
@media(max-width:900px){.bento{grid-template-columns:1fr 1fr}}@media(max-width:560px){.bento{grid-template-columns:1fr}}

/* counters */
.cband{background:linear-gradient(135deg,#1d4a2a,#2f7a38);color:#fff;position:relative;overflow:hidden}
.cband::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,rgba(140,198,63,.25),transparent 40%),radial-gradient(circle at 85% 80%,rgba(255,255,255,.1),transparent 40%)}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;position:relative}
.cgrid button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);border-radius:20px;padding:1.5rem 1rem;color:#fff;display:grid;gap:.3rem;justify-items:center;transition:.3s}
.cgrid button:hover{background:rgba(255,255,255,.16);transform:translateY(-4px)}
.cgrid b{font:800 clamp(2rem,4.4vw,3.2rem) var(--font-d);line-height:1;font-variant-numeric:tabular-nums}
.cgrid span{color:#cfe6c8;font-size:.92rem}
@media(max-width:760px){.cgrid{grid-template-columns:1fr 1fr}}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;position:relative}
.tl::before{content:"";position:absolute;left:5%;right:5%;top:22px;height:3px;background:linear-gradient(90deg,var(--green),var(--lime));border-radius:3px}
.tl button{border:0;background:none;display:grid;gap:.6rem;justify-items:center;text-align:center;position:relative;color:var(--ink);padding:0 .3rem}
.tl .dot{width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--green);display:grid;place-items:center;font:700 .82rem var(--font-d);color:var(--forest);z-index:1;transition:.3s}
.tl button:hover .dot{background:var(--green);color:#fff;transform:scale(1.15)}
.tl b{font-family:var(--font-d);color:var(--forest);font-size:1.25rem}
.tl small{color:var(--muted);line-height:1.3}
@media(max-width:760px){.tl{grid-template-columns:1fr;gap:.8rem}.tl::before{left:22px;right:auto;top:0;bottom:0;width:3px;height:auto}.tl button{grid-template-columns:46px 1fr;text-align:left;justify-items:start;gap:.2rem 1rem;align-items:center}.tl button>div{display:grid}}

/* tips + gallery */
.tips{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.tip{border:0;text-align:left;border-radius:20px;padding:1.4rem;display:grid;gap:.6rem;background:linear-gradient(160deg,var(--soft2),#fff);border:1px solid var(--line);color:var(--ink);transition:.3s}
.tip:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:var(--shadow)}
.tip .n{font:800 2.2rem var(--font-d);color:var(--lime);-webkit-text-stroke:1px var(--green);line-height:1}

var heroIdx=0,heroTimer=null,pmTimer=null,cdTimer=null,IO=null,IC2=null;
function setHero(i){
  var h=$('#hero');if(!h)return;var sl=$$('.hs',h),n=sl.length;heroIdx=(i+n)%n;
  sl.forEach(function(e,k){e.classList.toggle('on',k===heroIdx)});
  $$('[data-hdot]',h).forEach(function(e,k){e.classList.toggle('on',k===heroIdx)});
  var c=$('#hcount');if(c)c.textContent=String(heroIdx+1).padStart(2,'0')+' / '+String(n).padStart(2,'0');
  h.classList.remove('run');void h.offsetWidth;h.classList.add('run');
}
function setPm(pm,i){
  var imgs=$$('img',pm),n=imgs.length;if(!n)return;i=(i+n)%n;pm.dataset.i=i;
  imgs.forEach(function(e,k){e.classList.toggle('on',k===i)});
  $$('[data-dot]',pm).forEach(function(e,k){e.classList.toggle('on',k===i)});
  var g=pm.closest('[data-gal]');if(g)$$('[data-thumb]',g).forEach(function(e,k){e.classList.toggle('on',k===i)});
}
function updateCd(){
  var c=$('#cd');if(!c)return;var t=new Date(c.dataset.t+'T08:00:00+03:00').getTime()-Date.now();if(t<0)t=0;
  var d=Math.floor(t/864e5),h=Math.floor(t%864e5/36e5),m=Math.floor(t%36e5/6e4),s=Math.floor(t%6e4/1e3);
  $('#cd_d').textContent=d;$('#cd_h').textContent=String(h).padStart(2,'0');$('#cd_m').textContent=String(m).padStart(2,'0');$('#cd_s').textContent=String(s).padStart(2,'0');
}
function countUp(el){
  var to=+el.dataset.to,suf=el.dataset.suf||'',t0=null;
  function f(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/1600),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString('en-KE')+suf;if(p<1)requestAnimationFrame(f)}
  requestAnimationFrame(f);
}
function initPage(){
  clearInterval(heroTimer);clearInterval(pmTimer);clearInterval(cdTimer);heroIdx=0;
  if($('#hero')&&$$('.hs').length>1)heroTimer=setInterval(function(){if(!document.hidden)setHero(heroIdx+1)},6000);
  pmTimer=setInterval(function(){if(document.hidden)return;$$('.pm').forEach(function(pm){if(+pm.dataset.n>1&&!pm.matches(':hover'))setPm(pm,(+pm.dataset.i||0)+1)})},5000);
  if($('#cd')){updateCd();cdTimer=setInterval(updateCd,1000)}
  if(IO)IO.disconnect();if(IC2)IC2.disconnect();
  var rv=$$('.rv'),cn=$$('.cnt');
  if(!('IntersectionObserver' in window)){rv.forEach(function(e){e.classList.add('in')});return}
  IO=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');IO.unobserve(e.target)}})},{rootMargin:'0px 0px -6% 0px',threshold:.08});
  rv.forEach(function(e){IO.observe(e)});
  IC2=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){countUp(e.target);IC2.unobserve(e.target)}})},{threshold:.5});
  cn.forEach(function(e){IC2.observe(e)});
}

  return '<div class="tbl"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th>'+(edit?'<th></th>':'')+'</tr></thead><tbody>'+list.map(function(o){return '<tr><td><b>'+esc(o.id)+'</b><br><small>'+esc(o.date)+'</small></td><td>'+esc(o.name)+'<br><small>'+esc(o.phone)+' · '+esc(o.town)+', '+esc(o.county)+'</small>'+(o.notes?'<br><small>Note: '+esc(o.notes)+'</small>':'')+'</td><td>'+o.items.map(function(i){return esc(i.name)+' × '+i.qty}).join('<br>')+'</td><td>'+money(o.total)+'</td><td>'+(edit?'<select data-ost="'+o.id+'" class="sel">'+['New','Confirmed','Delivered','Cancelled'].map(function(s){return '<option'+(o.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select>':'<span class="pill '+o.status+'">'+o.status+'</span>')+'</td>'+(edit?'<td><div class="acts"><a class="sm-btn" target="_blank" rel="noopener" href="https://wa.me/'+waNum(o.phone)+'">'+ic('chat')+' WhatsApp</a><button class="sm-btn red" data-del="orders" data-id="'+o.id+'">'+ic('trash')+'</button></div></td>':'')+'</tr>'}).join('')+'</tbody></table></div>';
}

var FORMS={
  banners:{title:'Banner slide',fields:[{k:'eyebrow',l:'Small label above the title'},{k:'title',l:'Title',req:1},{k:'sub',l:'Description',t:'area'},{k:'cta',l:'Button text'},{k:'link',l:'Button link',help:'Use #shop, #events, #contact, a full https link, or the word wa for WhatsApp'},{k:'image',l:'Banner picture (optional)',t:'image'}],blank:{eyebrow:'',title:'',sub:'',cta:'Learn more',link:'#shop',image:''},pre:'b'},
  products:{title:'Product',fields:[{k:'name',l:'Product name',req:1},{k:'cat',l:'Category',t:'cat'},{k:'price',l:'Price per seedling (KSh)',t:'num'},{k:'step',l:'Suggested order step',t:'num'},{k:'stock',l:'Availability',t:'stockSel'},{k:'featured',l:'Show as popular on the home page',t:'bool'},{k:'desc',l:'Description',t:'area'},{k:'features',l:'Key features (one per line, leave blank for defaults)',t:'area'},{k:'tips',l:'Planting tip (leave blank for default)',t:'area'},{k:'images',l:'Photos (the first shows by default; several photos slide automatically)',t:'images'}],blank:{name:'',cat:'Vegetables',price:10,step:50,stock:'In stock',featured:false,desc:'',features:'',tips:'',images:[]},pre:'p'},
  gallery:{title:'Gallery photo',fields:[{k:'caption',l:'Caption',req:1},{k:'image',l:'Photo',t:'image'}],blank:{caption:'',image:''},pre:'g'},
  faq:{title:'Question',fields:[{k:'q',l:'Question',req:1},{k:'a',l:'Answer',t:'area'}],blank:{q:'',a:''},pre:'f'},
  events:{title:'Event or news',fields:[{k:'title',l:'Title',req:1},{k:'kind',l:'Type',t:'kind'},{k:'date',l:'Start date',t:'date',req:1},{k:'end',l:'End date (optional)',t:'date'},{k:'place',l:'Place'},{k:'text',l:'Description',t:'area'},{k:'link',l:'Link (registration or article)'},{k:'image',l:'Photo',t:'image'}],blank:{title:'',kind:'event',date:new Date().toISOString().slice(0,10),end:'',place:'',text:'',link:'',image:''},pre:'e'}
};
function resize(file,cb){
  var r=new FileReader();
  r.onerror=function(){toast('Could not read that file');cb(null)};
  r.onload=function(){var im=new Image();
    im.onerror=function(){toast('That file is not a picture');cb(null)};
    im.onload=function(){
      var m=SERVER?1600:1000,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      if(!SERVER){cb(c.toDataURL('image/jpeg',.8));return}
      toast('Uploading photo…');
      c.toBlob(function(bl){
        var fd=new FormData();fd.append('file',bl,'photo.jpg');
        api('upload',fd).then(function(res){if(res&&res.ok){toast('Photo saved on the server');cb(res.url)}else{toast((res&&res.error)||'Upload failed');cb(null)}}).catch(function(){toast('Upload failed. Check your connection.');cb(null)});
      },'image/jpeg',.86);
    };
    im.src=r.result};
  r.readAsDataURL(file)}
function openForm(col,id){
  var F=FORMS[col],draft,isNew=!id;
  if(isNew)draft=JSON.parse(JSON.stringify(F.blank));else draft=JSON.parse(JSON.stringify(DB[col].filter(function(x){return x.id===id})[0]));
  function render(){
    var body=F.fields.map(function(f){
      var v=draft[f.k],t=f.t||'text',inner='';
      if(t==='area')inner='<textarea data-f="'+f.k+'">'+esc(v)+'</textarea>';
      else if(t==='num')inner='<input data-f="'+f.k+'" type="number" min="0" value="'+esc(v)+'">';
      else if(t==='date')inner='<input data-f="'+f.k+'" type="date" value="'+esc(v)+'">';
      else if(t==='bool')inner='<span class="ck"><input data-f="'+f.k+'" type="checkbox"'+(v?' checked':'')+'> Yes</span>';
      else if(t==='cat')inner='<select data-f="'+f.k+'">'+cats().map(function(c){return '<option'+(v===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select>';
      else if(t==='stockSel')inner='<select data-f="'+f.k+'">'+['In stock','Limited stock','Out of stock','Made to order'].map(function(c){return '<option'+(v===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select>';
      else if(t==='kind')inner='<select data-f="'+f.k+'"><option value="event"'+(v==='event'?' selected':'')+'>Event</option><option value="news"'+(v==='news'?' selected':'')+'>News</option></select>';
      else if(t==='image'||t==='images'){var arr=t==='image'?(v?[v]:[]):(v||[]);inner='<div class="imgs">'+arr.map(function(u,i){return '<div class="th"><img src="'+esc(u)+'" alt=""><button type="button" data-rmimg="'+f.k+'" data-i="'+i+'" aria-label="Remove photo">×</button></div>'}).join('')+'<label class="upl">'+ic('plus')+' Add photo'+(t==='images'?'s':'')+'<input type="file" accept="image/*" '+(t==='images'?'multiple ':'')+'data-file="'+f.k+'" data-t="'+t+'"></label></div>'}
      else inner='<input data-f="'+f.k+'" value="'+esc(v)+'"'+(f.req?' required':'')+'>';
      return '<label class="l"'+(t==='area'||t==='images'||t==='image'?'':'')+'>'+f.l+(f.help?'<small>'+f.help+'</small>':'')+inner+'</label>';
    }).join('');
    $('#modalHost').innerHTML='<div class="modal" id="modalBg"><form class="box form" id="mform"><header><h3>'+(isNew?'Add ':'Edit ')+F.title+'</h3><button type="button" class="iconbtn" data-close="1" aria-label="Close">'+ic('x')+'</button></header>'+body+'<div class="row" style="justify-content:flex-end"><button type="button" class="btn alt" data-close="1">Cancel</button><button class="btn" type="submit">'+ic('save')+' Save</button></div></form></div>';
  }
  function collect(){$$('[data-f]',$('#mform')).forEach(function(el){var k=el.dataset.f;draft[k]=el.type==='checkbox'?el.checked:el.type==='number'?(+el.value||0):el.value})}
  render();
  var host=$('#modalHost');
  host.onclick=function(e){
    if(e.target.id==='modalBg'||e.target.closest('[data-close]')){host.innerHTML='';return}
    var rm=e.target.closest('[data-rmimg]');
    if(rm){collect();var k=rm.dataset.rmimg;if(Array.isArray(draft[k]))draft[k].splice(+rm.dataset.i,1);else draft[k]='';render()}
  };
  host.onchange=function(e){
    var el=e.target;if(!el.dataset||!el.dataset.file)return;
    var files=Array.prototype.slice.call(el.files),k=el.dataset.file,multi=el.dataset.t==='images';collect();var left=files.length;if(!left)return;
    files.forEach(function(fl){resize(fl,function(u){if(u){if(multi){draft[k]=(draft[k]||[]).concat([u])}else draft[k]=u}left--;if(!left)render()})});
  };
  host.onsubmit=function(e){
    e.preventDefault();collect();
    if(isNew){draft.id=uid(F.pre);DB[col].push(draft)}else{DB[col]=DB[col].map(function(x){return x.id===id?draft:x})}
    if(save()){host.innerHTML='';toast('Saved');route()}
  };
}
function bindAdmin(){}
document.addEventListener('click',function(e){
  if(!S.admin||location.hash!=='#admin')return;
  var t=e.target.closest('[data-tab],[data-new],[data-edit],[data-del],[data-act2]');if(!t)return;var d=t.dataset;
  if(d.tab){if(d.tab==='view'){location.hash='#home';return}if(d.tab==='out'){if(SERVER){api('logout',{}).catch(function(){});setTok('')}S.admin=false;route();return}S.tab=d.tab;if(SERVER&&['dash','orders','inbox'].indexOf(d.tab)>-1)loadInbox(route);else route();return}
  if(d.new){openForm(d.new);return}
  if(d.edit){openForm(d.edit,d.id);return}
  if(d.del){
    if(!t.classList.contains('arm')){t.classList.add('arm');t.dataset.old=t.innerHTML;t.textContent='Confirm delete?';setTimeout(function(){if(t.isConnected){t.classList.remove('arm');t.innerHTML=t.dataset.old}},3500);return}
    DB[d.del]=DB[d.del].filter(function(x){return x.id!==d.id});if(SERVER&&INBOXC.indexOf(d.del)>-1)api('inbox_op',{op:'del',col:d.del,id:d.id}).catch(function(){toast('Could not delete on the server')});else save();toast('Deleted');route();return;
  }
  var a=d.act2;
  if(a==='savesite'){$$('[data-set]').forEach(function(el){DB.settings[el.dataset.set]=el.value});if(save())toast('Site settings saved')}
  else if(a==='copyemails'){copy(DB.subs.map(function(s){return s.email}).join(', '),'Emails copied')}
  else if(a==='setpass'){api('setpass',{current:$('#cp0').value,password:$('#cp1').value}).then(function(r){if(r.ok){setTok(r.token);$('#cp0').value='';$('#cp1').value='';toast('Password changed')}else toast(r.error||'Could not change password')}).catch(function(){toast('Could not reach the server')})}
  else if(a==='migrate'){
    if(!t.classList.contains('arm')){t.classList.add('arm');t.textContent='Click again to confirm';return}
    var raw=null;try{raw=localStorage.getItem(KEY)}catch(x){}
    if(!raw){toast('No saved site was found in this browser');t.classList.remove('arm');t.textContent='Move this browser\'s site and photos to the server';return}
    try{var L=JSON.parse(raw);['banners','products','events','gallery','faq'].forEach(function(k){if(Array.isArray(L[k]))DB[k]=L[k]});if(L.settings){for(var kk in L.settings)if(kk!=='adminPass')DB.settings[kk]=L.settings[kk]}}catch(x){toast('Could not read this browser\'s saved site');return}
    migrateImages(function(n,total){save();toast(total?n+' of '+total+' photos are now stored on the server':'Site content moved to the server');setTimeout(route,600)});
  }
  else if(a==='copyexp'){copy($('#exp').value,'Backup copied')}
  else if(a==='import'){try{var o=JSON.parse($('#imp').value);if(!o.products||!o.settings)throw 0;if(SERVER){['banners','products','events','gallery','faq'].forEach(function(k){if(Array.isArray(o[k]))DB[k]=o[k]});for(var kk in o.settings)if(kk!=='adminPass')DB.settings[kk]=o.settings[kk];migrateImages(function(){save();toast('Backup restored');route()})}else{DB=o;if(save()){toast('Backup restored');route()}}}catch(x){toast('That is not a valid backup')}}
  else if(a==='reset'){if(!t.classList.contains('arm')){t.classList.add('arm');t.textContent='Click again to confirm';return}DB=defaults();save();CART=[];saveCart();toast('Site reset');route()}
});
document.addEventListener('change',function(e){
  var el=e.target;if(el.dataset&&el.dataset.ost){DB.orders.forEach(function(o){if(o.id===el.dataset.ost)o.status=el.value});if(SERVER)api('inbox_op',{op:'status',col:'orders',id:el.dataset.ost,status:el.value}).catch(function(){toast('Could not update the order')});else save();toast('Order updated')}
});
function copy(text,msg){
  function fb(){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(x){toast('Select and copy the text manually')}ta.remove()}
  try{navigator.clipboard.writeText(text).then(function(){toast(msg)},fb)}catch(x){fb()}
}

function killSplash(){if(SPL&&ROUTED){var sp=$('#splash');if(sp)sp.remove()}}
setTimeout(function(){SPL=true;killSplash()},3500);
bootServer().then(function(){ROUTED=true;route();killSplash()});
